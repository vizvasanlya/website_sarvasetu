<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SarvaSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #08090c;
      --text: #e8e8e8;
      --dim: #555;
      --glow: #7c5cff;
      --cyan: #00e5ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---- grid noise overlay ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(255,255,255,.03) 50px),
        repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(255,255,255,.03) 50px);
      pointer-events: none;
      z-index: 0;
    }

    /* ---- top bar ---- */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      z-index: 10;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
    }

    .topbar .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px; height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 8px var(--cyan);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ---- hero ---- */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6rem 2.5rem 3rem;
    }

    /* big creative text block */
    .headline {
      max-width: 900px;
    }

    .line {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      overflow: hidden;
    }

    .line .word {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: 1;
      text-transform: uppercase;
      transform: translateY(120%);
      animation: reveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .line:nth-child(1) .word { animation-delay: 0.2s; }
    .line:nth-child(2) .word { animation-delay: 0.4s; }
    .line:nth-child(3) .word { animation-delay: 0.6s; }

    .word.gradient {
      background: linear-gradient(135deg, var(--glow), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .word.outline {
      -webkit-text-stroke: 1.5px var(--text);
      color: transparent;
    }

    .word.small {
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      font-weight: 600;
      color: var(--dim);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .word.accent {
      color: var(--cyan);
    }

    .word.strike {
      text-decoration: line-through;
      text-decoration-color: var(--glow);
      text-decoration-thickness: 3px;
      color: var(--dim);
    }

    /* rotating badge */
    .rotator {
      position: absolute;
      right: 8%;
      top: 50%;
      transform: translateY(-50%);
      width: 140px;
      height: 140px;
      animation: spin 12s linear infinite;
    }

    .rotator svg {
      width: 100%;
      height: 100%;
    }

    .rotator text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* divider line */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--glow), var(--cyan));
      margin: 3rem 0;
      animation: fadeIn 1s ease 1s both;
    }

    /* bottom row */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 2rem;
      animation: fadeIn 1s ease 1.2s both;
    }

    .bottom-left p {
      color: var(--dim);
      font-size: 0.9rem;
      line-height: 1.7;
      max-width: 380px;
    }

    .bottom-left p strong {
      color: var(--text);
      font-weight: 600;
    }

    .email-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.5rem;
      padding: 0.85rem 1.6rem;
      border: 1px solid rgba(124, 92, 255, 0.3);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .email-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.1), rgba(0, 229, 255, 0.1));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .email-link:hover::before { opacity: 1; }
    .email-link:hover { border-color: var(--glow); transform: translateY(-2px); }

    .email-link svg {
      width: 16px; height: 16px;
      color: var(--cyan);
    }

    .bottom-right {
      text-align: right;
    }

    .time {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }

    /* corner markers */
    .corner {
      position: fixed;
      width: 30px; height: 30px;
      z-index: 10;
    }

    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.08);
    }

    .corner-tl { top: 1.2rem; left: 1.2rem; }
    .corner-tl::before { top: 0; left: 0; width: 30px; height: 1px; }
    .corner-tl::after { top: 0; left: 0; width: 1px; height: 30px; }

    .corner-tr { top: 1.2rem; right: 1.2rem; }
    .corner-tr::before { top: 0; right: 0; width: 30px; height: 1px; }
    .corner-tr::after { top: 0; right: 0; width: 1px; height: 30px; }

    .corner-bl { bottom: 1.2rem; left: 1.2rem; }
    .corner-bl::before { bottom: 0; left: 0; width: 30px; height: 1px; }
    .corner-bl::after { bottom: 0; left: 0; width: 1px; height: 30px; }

    .corner-br { bottom: 1.2rem; right: 1.2rem; }
    .corner-br::before { bottom: 0; right: 0; width: 30px; height: 1px; }
    .corner-br::after { bottom: 0; right: 0; width: 1px; height: 30px; }

    @keyframes reveal {
      to { transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .rotator { display: none; }
      .hero { padding: 7rem 1.5rem 3rem; }
      .bottom { flex-direction: column; align-items: flex-start; }
      .bottom-right { text-align: left; }
      .topbar { padding: 1.2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- corner markers -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- top bar -->
  <header class="topbar">
    <div class="logo">Sarvasetu</div>
    <div class="status"><span class="dot"></span> Active in dev</div>
  </header>

  <!-- hero -->
  <section class="hero">
    <div class="headline">
      <div class="line">
        <span class="word small">we are</span>
      </div>
      <div class="line">
        <span class="word gradient">crafting</span>
      </div>
      <div class="line">
        <span class="word outline">the</span>
        <span class="word">future.</span>
      </div>
    </div>

    <!-- rotating circle badge -->
    <div class="rotator">
      <svg viewBox="0 0 200 200">
        <defs>
          <path id="circlePath" d="M 100,100 m -75,0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" />
        </defs>
        <text>
          <textPath href="#circlePath">
            * coming soon * stay tuned * sarvasetu * something big * 
          </textPath>
        </text>
      </svg>
    </div>

    <div class="divider"></div>

    <div class="bottom">
      <div class="bottom-left">
        <p>
          <strong>SarvaSetu</strong> — where every connection matters.
          We're building something that bridges gaps, breaks barriers,
          and brings people together in ways that haven't been done before.
        </p>
        <a href="mailto:support@sarvasetu.com" class="email-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
          support@sarvasetu.com
        </a>
      </div>
      <div class="bottom-right">
        <div class="time" id="liveTime"></div>
      </div>
    </div>
  </section>

  <script>
    function updateTime() {
      const now = new Date();
      const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      document.getElementById('liveTime').textContent = now.toLocaleTimeString('en-IN', options) + ' IST';
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
